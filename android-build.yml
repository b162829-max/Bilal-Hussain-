name: Driver Accounts APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        run: |
          ZIP_FILE="DriverAccounts_Modern_Blue_English.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found: $ZIP_FILE"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          rsync -a extracted/ ./ --exclude=.git

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Accounts-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
